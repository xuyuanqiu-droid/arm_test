name: ARM64 Test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check Architecture
        run: uname -m
      - name: Install gdata
        run: wget -qO- https://cli.test.data.garenanow.com/install.sh | sh
      - name: Verify
        run: |
          source ~/.bashrc
          gdata version
